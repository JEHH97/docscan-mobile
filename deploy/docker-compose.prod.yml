services:
  docscan-api:
    image: ghcr.io/jehh97/docscan-api:${DOCSCAN_API_TAG:-v1.0.1}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    mem_limit: 512m
    pids_limit: 128
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_HOST_PORT:-7860}:7860"
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      RESULT_TTL_SECONDS: ${RESULT_TTL_SECONDS:-3600}
      API_KEY: ${API_KEY:-}
      WEBHOOKS_ENABLED: ${WEBHOOKS_ENABLED:-false}
    healthcheck:
      test:
        ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:7860/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  docscan-mobile-web:
    image: ghcr.io/jehh97/docscan-mobile-web:${DOCSCAN_MOBILE_WEB_TAG:-v1.0.1}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    mem_limit: 128m
    pids_limit: 64
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_HOST_PORT:-8080}:8080"
    environment:
      API_URL: ${API_URL:-}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
